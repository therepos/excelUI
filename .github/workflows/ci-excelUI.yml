name: Release excelUI

on:
  push:
    branches: [ main ]
    paths:
      - src/excelUI/**
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }

      - name: Build add-in from source (.bas/.cls/.xml)
        run: |
          pip install oletools
          python scripts/vbabuild.py src/excelUI src/excelUI/excelUI.xlam

      - name: Commit rebuilt add-in
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/excelUI/excelUI.xlam
          git diff --cached --quiet || (git commit -m "Rebuild excelUI.xlam from source [skip ci]" && git push origin HEAD:${{ github.ref_name }})

      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: excelUI-v

      - name: Seal VBA project
        run: python scripts/vbaseal.py src/excelUI/excelUI.xlam

      - name: Package release
        run: |
          New-Item -ItemType Directory -Force -Path rel | Out-Null
          Copy-Item src\excelUI\excelUI.xlam rel\excelUI.xlam
          Copy-Item src\excelUI\excelUIsetup.cmd rel\excelUIsetup.cmd
          Compress-Archive -Path rel\excelUIsetup.cmd -DestinationPath rel\excelUI.zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          files: |
            rel/excelUI.xlam
            rel/excelUI.zip
          token: ${{ secrets.GITHUB_TOKEN }}